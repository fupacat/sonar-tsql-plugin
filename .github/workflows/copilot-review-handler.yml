name: "Auto-summon Copilot on Review Changes Requested"

on:
  pull_request_review:
    types:
      - submitted

jobs:
  dispatch-copilot:
    name: Notify Copilot of Review Feedback
    runs-on: ubuntu-latest
    if: github.event.review.state == 'changes_requested'
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Comment on PR to Summon Copilot
        env:
          GH_TOKEN: ${{ secrets.COPILOT_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          echo "Review submitted requesting changes by @${REVIEWER} on PR #${PR_NUMBER}."
          gh pr comment "${PR_NUMBER}" \
            --body "@copilot Changes were requested on this pull request by @${REVIEWER}. Please review the feedback, implement the necessary corrections, and push an update."

