name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        run: |
          set -o pipefail
          mvn clean verify --batch-mode -e 2>&1 | tee /tmp/maven.log || {
            tail -n 100 /tmp/maven.log >> $GITHUB_STEP_SUMMARY
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-failure-log
            cp /tmp/maven.log build-failure.log
            git add build-failure.log
            git commit -m "chore: record build failure log"
            git push origin build-failure-log --force
            exit 1
          }

      - name: Upload Plugin Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-tsql-plugin
          path: target/sonar-tsql-plugin-*.jar
          if-no-files-found: error
