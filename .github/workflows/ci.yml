name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Validate release guard scenarios
        run: bash scripts/test-release-contract.sh

      - name: Build and Test with Maven
        run: mvn clean verify --batch-mode

      - name: Upload Plugin Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: sonar-tsql-plugin
          path: target/sonar-tsql-plugin-*.jar
          if-no-files-found: error

  smoke-test:
    name: SonarQube smoke test (${{ matrix.sq-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        sq-version: ['9.9.1-community', '25.1.0.102122-community']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download verified plugin for smoke test
        uses: actions/download-artifact@v4
        with:
          name: sonar-tsql-plugin
          path: target/

      - name: Validate packaged plugin against SonarQube ${{ matrix.sq-version }}
        env:
          SQ_VERSION: ${{ matrix.sq-version }}
        run: ./scripts/sonarqube-smoke-test.sh

  update-prs:
    name: Update Open PR Branches on Main Push
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Update Open Non-Draft PR Branches
        env:
          GH_TOKEN: ${{ secrets.COPILOT_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR_NUMBERS=$(gh pr list --state open --json number,isDraft --jq '.[] | select(.isDraft == false) | .number')
          if [ -z "$PR_NUMBERS" ]; then
            echo "No open non-draft PRs to update."
            exit 0
          fi
          for PR_NUM in $PR_NUMBERS; do
            echo "Updating branch for PR #${PR_NUM}..."
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GH_REPO}/pulls/${PR_NUM}/update-branch" \
              || echo "Could not auto-update PR #${PR_NUM} (may have merge conflicts)."
          done
